<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">Hash index equality lookup</title>
  <desc id="desc">A hash function maps an exact key to a bucket containing matching entries. Hash order does not support sorted range scans.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#176b4d"/></marker></defs>
  <rect width="760" height="310" rx="18" fill="#f4f8f5"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="380" y="32" font-size="19" font-weight="700" fill="#173d2e">Equality lookup: hash the key, then inspect its bucket</text>
    <rect x="35" y="120" width="145" height="62" rx="12" fill="#fff" stroke="#176b4d" stroke-width="2"/><text x="107" y="146" font-size="14" fill="#58695f">Query</text><text x="107" y="168" font-size="18" font-weight="700" fill="#173d2e">city = "Oslo"</text>
    <rect x="230" y="120" width="155" height="62" rx="12" fill="#dceee3" stroke="#176b4d" stroke-width="2"/><text x="307" y="146" font-size="14" fill="#58695f">Hash function</text><text x="307" y="168" font-size="18" font-weight="700" fill="#173d2e">h("Oslo") = 3</text>
    <rect x="440" y="105" width="130" height="92" rx="12" fill="#176b4d"/><text x="505" y="137" font-size="14" fill="#eaf4ee">Bucket 3</text><text x="505" y="164" font-size="16" fill="#fff">Oslo → row 8</text><text x="505" y="185" font-size="14" fill="#eaf4ee">Oslo → row 21</text>
    <rect x="615" y="120" width="110" height="62" rx="12" fill="#fff" stroke="#a76018" stroke-width="2"/><text x="670" y="146" font-size="14" fill="#58695f">Fetch</text><text x="670" y="168" font-size="16" font-weight="700" fill="#493310">matching row</text>
    <path d="M182 151H226M388 151H436M573 151H611" stroke="#176b4d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="250" font-size="17" font-weight="700" fill="#a14424">Good for equality; hash order cannot answer “between A and M”.</text>
  </g>
</svg>
