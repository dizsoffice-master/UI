<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">LSM-tree write and read path</title>
  <desc id="desc">Writes enter a memory table, are flushed as immutable sorted files, and are compacted across levels. Reads check memory and relevant files.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#176b4d"/></marker></defs>
  <rect width="760" height="330" rx="18" fill="#f4f8f5"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="380" y="32" font-size="19" font-weight="700" fill="#173d2e">LSM-tree: fast writes, sorted files, background compaction</text>
    <rect x="35" y="107" width="130" height="62" rx="11" fill="#fff" stroke="#176b4d" stroke-width="2"/><text x="100" y="133" font-size="14" fill="#58695f">New write</text><text x="100" y="155" font-size="17" font-weight="700" fill="#173d2e">key = 42</text>
    <rect x="210" y="95" width="145" height="86" rx="11" fill="#dceee3" stroke="#176b4d" stroke-width="2"/><text x="282" y="128" font-size="16" font-weight="700" fill="#173d2e">Memtable</text><text x="282" y="153" font-size="13" fill="#58695f">in memory</text>
    <rect x="410" y="85" width="135" height="52" rx="9" fill="#fff" stroke="#176b4d" stroke-width="2"/><text x="477" y="117" font-size="16" fill="#173d2e">SSTable L0</text>
    <rect x="410" y="151" width="135" height="52" rx="9" fill="#fff" stroke="#176b4d" stroke-width="2"/><text x="477" y="183" font-size="16" fill="#173d2e">SSTable L1</text>
    <rect x="410" y="217" width="135" height="52" rx="9" fill="#fff" stroke="#176b4d" stroke-width="2"/><text x="477" y="249" font-size="16" fill="#173d2e">SSTable L2</text>
    <rect x="595" y="132" width="132" height="78" rx="11" fill="#ffe6a8" stroke="#a76018" stroke-width="2"/><text x="661" y="163" font-size="15" font-weight="700" fill="#493310">Compaction</text><text x="661" y="185" font-size="13" fill="#493310">merge sorted files</text>
    <path d="M168 138H206M357 138H405M548 110C570 110 570 148 591 155M548 177H591M548 244C570 244 570 204 591 190" fill="none" stroke="#176b4d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="286" y="225" font-size="14" fill="#58695f">Flush when full</text>
    <text x="380" y="302" font-size="14" fill="#58695f">Reads may consult memory and multiple sorted runs; filters and compaction manage read cost.</text>
  </g>
</svg>
