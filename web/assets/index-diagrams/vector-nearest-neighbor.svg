<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Vector index nearest-neighbor search</title>
  <desc id="desc">A query vector is compared with indexed vectors using a similarity measure, and the closest matching records are returned.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#176b4d"/></marker></defs>
  <rect width="760" height="320" rx="18" fill="#f4f8f5"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="380" y="32" font-size="19" font-weight="700" fill="#173d2e">Vector search ranks records by similarity, not exact key equality</text>
    <rect x="35" y="115" width="150" height="76" rx="12" fill="#fff" stroke="#176b4d" stroke-width="2"/>
    <text x="110" y="145" font-size="14" fill="#58695f">Query embedding</text>
    <text x="110" y="172" font-size="16" font-weight="700" fill="#173d2e">[0.2, 0.7, …]</text>
    <rect x="270" y="74" width="190" height="176" rx="12" fill="#dceee3" stroke="#176b4d" stroke-width="2"/>
    <text x="365" y="101" font-size="15" font-weight="700" fill="#173d2e">Indexed vectors</text>
    <circle cx="320" cy="143" r="12" fill="#176b4d"/><text x="352" y="148" font-size="14" fill="#173d2e">record A</text>
    <circle cx="408" cy="179" r="15" fill="#a76018"/><text x="368" y="216" font-size="14" fill="#173d2e">record B</text>
    <circle cx="316" cy="219" r="10" fill="#176b4d"/><text x="435" y="145" font-size="14" fill="#173d2e">record C</text>
    <rect x="540" y="111" width="185" height="86" rx="12" fill="#176b4d"/>
    <text x="632" y="143" font-size="15" fill="#eaf4ee">Similarity ranking</text>
    <text x="632" y="173" font-size="17" font-weight="700" fill="#fff">Top-k candidates</text>
    <path d="M188 153H264M464 153H534" stroke="#176b4d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="286" font-size="13" fill="#58695f">The vector index and distance metric are product- and version-specific; verify the supported deployment.</text>
  </g>
</svg>
