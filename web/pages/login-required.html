<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Required</title>
  <link rel="stylesheet" href="../assets/site-columns.css">
  <link rel="stylesheet" href="../assets/master.css">
  <script src="../assets/site-partials.js"></script>
  <style>
    body {
      background: var(--page-bg);
    }

    .login-required-page {
      min-height: 100vh;
      background: var(--page-bg);
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-required-box {
      max-width: 680px;
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: white;
      box-shadow: var(--shadow);
      padding: 40px 30px;
      text-align: center;
    }

    .login-required-box h1 {
      color: var(--blue-dark);
      font-size: clamp(34px, 4vw, 48px);
      margin-bottom: 12px;
    }

    .login-required-box p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 22px;
    }

    .login-required-box a {
      display: inline-block;
      background: var(--blue-dark);
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="siteHeader"></div>
  <div id="headerServicesLayer"></div>
  <div id="topGoogleAd"></div>

  <main class="login-required-page">
    <section class="login-required-box">
      <h1>Login Required</h1>
      <p>Your session is invalid or expired. Please login again to access the private dashboard.</p>
      <a href="sql-syntax-formatter-online-free-tool.html">Login Again</a>
    </section>
  </main>

  <div id="bottomGoogleAd"></div>
  <div id="footerServicesLayer"></div>
  <div id="siteFooter"></div>
</body>
</html>
